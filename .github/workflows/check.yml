name: Check engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --include-ignored
      - run: cargo build --locked --release
      - run: python3 tools/reftest.py --binary target/release/eris-browser
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Preserve matching upstream HTML trees
        run: python3 tools/html_conformance.py --baseline tests/conformance/html-tree-current.json
      - run: timeout 180s target/release/eris-stress 5000
