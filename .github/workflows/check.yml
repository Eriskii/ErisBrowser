name: Check engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo check --locked --all-targets
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - name: Verify pinned Unicode identifier tables offline
        run: python3 tools/generate_js_identifiers.py --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --include-ignored
        env:
          # Sanitize build/CI descriptors before test startup; worker startup
          # still rejects descriptors deliberately inherited by a test.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: python3 tools/ci_test_runner.py
      - run: cargo build --locked --release
      - run: python3 tools/reftest.py --binary target/release/eris-browser
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Preserve matching upstream HTML trees
        run: python3 tools/html_conformance.py --baseline tests/conformance/html-tree-current.json
      - name: Preserve passing cases in the pinned Test262 selection
        run: python3 tools/test262_conformance.py --baseline tests/conformance/test262-current.json
      - name: Preserve pinned Reflect call and constructor cases
        run: python3 tools/test262_conformance.py --profile reflect-construction --baseline tests/conformance/test262-reflect-construction-current.json --output artifacts/test262-reflect-construction-gate.json
      - name: Preserve pinned RegExp split and species cases
        run: python3 tools/test262_conformance.py --profile regexp-split --baseline tests/conformance/test262-regexp-split-current.json --output artifacts/test262-regexp-split-gate.json
      - name: Preserve pinned String and RegExp match/search protocols
        run: python3 tools/test262_conformance.py --profile regexp-match-search --baseline tests/conformance/test262-regexp-match-search-current.json --output artifacts/test262-regexp-match-search-gate.json
      - name: Preserve pinned String lastIndexOf cases
        run: python3 tools/test262_conformance.py --profile string-last-index-of --baseline tests/conformance/test262-string-last-index-of-current.json --output artifacts/test262-string-last-index-of-gate.json
      - name: Preserve pinned String search and split cases
        run: python3 tools/test262_conformance.py --profile string-search --baseline tests/conformance/test262-string-search-current.json --output artifacts/test262-string-search-gate.json
      - name: Preserve pinned dynamic Function constructor cases
        run: python3 tools/test262_conformance.py --profile function-constructor --baseline tests/conformance/test262-function-constructor-current.json --output artifacts/test262-function-constructor-gate.json
      - name: Preserve pinned new.target cases
        run: python3 tools/test262_conformance.py --profile new-target --baseline tests/conformance/test262-new-target-current.json --output artifacts/test262-new-target-gate.json
      - name: Preserve passing cases in the separate pinned RegExp selection
        run: python3 tools/test262_conformance.py --profile regexp --baseline tests/conformance/test262-regexp-current.json --output artifacts/test262-regexp-gate.json
      - name: Preserve passing cases in the pinned template literal selection
        run: python3 tools/test262_conformance.py --profile template-literal --baseline tests/conformance/test262-template-literal-current.json --output artifacts/test262-template-literal-gate.json
      - name: Preserve passing cases in the complete pinned function inventory
        run: python3 tools/test262_conformance.py --profile functions --baseline tests/conformance/test262-functions-current.json --output artifacts/test262-functions-gate.json
      - name: Preserve passing cases in the complete pinned rest-parameter directory
        run: python3 tools/test262_conformance.py --profile rest-parameters --baseline tests/conformance/test262-rest-parameters-current.json --output artifacts/test262-rest-parameters-gate.json
      - name: Preserve passing cases in the complete pinned prototype-membership directory
        run: python3 tools/test262_conformance.py --profile is-prototype-of --baseline tests/conformance/test262-is-prototype-of-current.json --output artifacts/test262-is-prototype-of-gate.json
      - name: Preserve passing cases in the complete pinned global-value directories
        run: python3 tools/test262_conformance.py --profile global-values --baseline tests/conformance/test262-global-values-current.json --output artifacts/test262-global-values-gate.json
      - name: Preserve passing cases in the complete paired reduction directories
        run: python3 tools/test262_conformance.py --profile array-reduce --baseline tests/conformance/test262-array-reduce-current.json --output artifacts/test262-array-reduce-gate.json
      - name: Preserve passing cases in the pinned Number static builtin inventory
        run: python3 tools/test262_conformance.py --profile number-statics --baseline tests/conformance/test262-number-statics-current.json --output artifacts/test262-number-statics-gate.json
      - name: Preserve passing cases in the complete coercing global predicate directories
        run: python3 tools/test262_conformance.py --profile numeric-conversion --baseline tests/conformance/test262-numeric-conversion-current.json --output artifacts/test262-numeric-conversion-gate.json
      - name: Preserve passing cases in the complete compound-assignment directory
        run: python3 tools/test262_conformance.py --profile compound-assignment --baseline tests/conformance/test262-compound-assignment-current.json --output artifacts/test262-compound-assignment-gate.json
      - name: Preserve passing cases in the complete addition directory
        run: python3 tools/test262_conformance.py --profile addition --baseline tests/conformance/test262-addition-current.json --output artifacts/test262-addition-gate.json
      - name: Preserve passing cases in the complete logical-assignment directory
        run: python3 tools/test262_conformance.py --profile logical-assignment --baseline tests/conformance/test262-logical-assignment-current.json --output artifacts/test262-logical-assignment-gate.json
      - name: Preserve passing cases in the complete relational comparison directories
        run: python3 tools/test262_conformance.py --profile relational --baseline tests/conformance/test262-relational-current.json --output artifacts/test262-relational-gate.json
      - name: Preserve passing cases in the complete equality directories
        run: python3 tools/test262_conformance.py --profile equality --baseline tests/conformance/test262-equality-current.json --output artifacts/test262-equality-gate.json
      - name: Preserve passing cases in the complete labeled control-flow directories
        run: python3 tools/test262_conformance.py --profile labels --baseline tests/conformance/test262-labels-current.json --output artifacts/test262-labels-gate.json
      - name: Preserve passing cases in the complete Symbol tree and key-reflection directories
        run: python3 tools/test262_conformance.py --profile symbols --baseline tests/conformance/test262-symbols-current.json --output artifacts/test262-symbols-gate.json
      - name: Preserve passing cases in the complete String concat directory
        run: python3 tools/test262_conformance.py --profile string-concat --baseline tests/conformance/test262-string-concat-current.json --output artifacts/test262-string-concat-gate.json
      - run: timeout 180s target/release/eris-stress 5000
  presenter-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - toolchain: 1.88.0
            cargo-args: ''
          - toolchain: 1.88.0
            cargo-args: '--features vulkan-presenter'
          - toolchain: stable
            cargo-args: '--features vulkan-presenter'
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: python3 tools/ci_test_runner.py
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy
      - run: cargo clippy --locked --all-targets ${{ matrix.cargo-args }} -- -D warnings
      - run: cargo test --locked ${{ matrix.cargo-args }} -- --include-ignored
      # These tests cover CPU ownership, deadlines and transfer layout. A real
      # Vulkan surface/readback is a separate host check, never an inferred pass.
  vulkan-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path tools/vulkan-probe/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/vulkan-probe/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/vulkan-probe/Cargo.toml
      - run: python3 -m unittest discover -s tools/vulkan-probe -p 'test_*.py'
      # GPU execution is an explicit host check; CI must not label an absent
      # adapter as a successful transfer or browser rendering result.
