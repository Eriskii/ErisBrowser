name: Check engine
on: [push, pull_request]
permissions:
  contents: read
jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo check --locked --all-targets
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --include-ignored
        env:
          # Sanitize build/CI descriptors before test startup; worker startup
          # still rejects descriptors deliberately inherited by a test.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: python3 tools/ci_test_runner.py
      - run: cargo build --locked --release
      - run: python3 tools/reftest.py --binary target/release/eris-browser
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Preserve matching upstream HTML trees
        run: python3 tools/html_conformance.py --baseline tests/conformance/html-tree-current.json
      - name: Preserve passing cases in the pinned Test262 selection
        run: python3 tools/test262_conformance.py --baseline tests/conformance/test262-current.json
      - name: Preserve passing cases in the separate pinned RegExp selection
        run: python3 tools/test262_conformance.py --profile regexp --baseline tests/conformance/test262-regexp-current.json --output artifacts/test262-regexp-gate.json
      - name: Preserve passing cases in the pinned template literal selection
        run: python3 tools/test262_conformance.py --profile template-literal --baseline tests/conformance/test262-template-literal-current.json --output artifacts/test262-template-literal-gate.json
      - run: timeout 180s target/release/eris-stress 5000
  vulkan-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path tools/vulkan-probe/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/vulkan-probe/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/vulkan-probe/Cargo.toml
      - run: python3 -m unittest discover -s tools/vulkan-probe -p 'test_*.py'
      # GPU execution is an explicit host check; CI must not label an absent
      # adapter as a successful transfer or browser rendering result.
