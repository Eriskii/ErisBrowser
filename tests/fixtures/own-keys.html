<!doctype html>

<title>Property enumeration through document callbacks</title>
<style>

#ordering{left:0}#unicode{left:50px}#values{left:100px}#descriptors{left:150px}#shrink{left:200px}#inherited{left:250px}

<div id="values" class="sample"></div><div id="descriptors" class="sample"></div>
<div id="shrink" class="sample"></div><div id="inherited" class="sample"></div>
<button id="change" type="button">Run enumeration callbacks</button><div id="result"></div>
<script>
