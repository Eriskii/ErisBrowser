<html><head><meta charset="utf-8"><title>base</title>
<style>

var red=document.getElementById('red'),blue=document.getElementById('blue');

red.addEventListener('click',function(){trace+='C';Promise.all([]).then(function(){trace+='D';red.style.left='16px';});queueMicrotask(function(){trace+='K';});});
