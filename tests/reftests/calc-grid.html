<!doctype html>
<style>
body{margin:0}
main{position:absolute;left:10px;top:10px;width:280px;height:80px;display:grid;
grid-template-columns:calc(50% - 10px) calc(50% - 10px);
grid-template-rows:calc(50% - 5px) calc(50% - 5px);
column-gap:calc(5% + 6px);row-gap:calc(25% - 10px);background:#eeeeee}
i{background:#23956b}b{background:#267cbd}em{background:#da583c}strong{background:#cfb53b}
</style>
<main><i></i><b></b><em></em><strong></strong></main>
