<!doctype html>
<style>
body{margin:0}
main{position:absolute;top:10px;width:100px;row-gap:calc(10% + 10px);background:#eeeeee}
#grid{left:10px;display:grid;grid-template-columns:40px;grid-template-rows:40px 40px;align-content:start}
#flex{left:150px;display:flex;flex-direction:column;align-items:flex-start}
i{display:block;flex:none;width:40px;height:40px;background:#23956b}i+i{background:#267cbd}
</style>
<main id="grid"><i></i><i></i></main>
<main id="flex"><i></i><i></i></main>
