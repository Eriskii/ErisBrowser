<!doctype html>
<style>
body { margin: 0 }
i { position: absolute; top: 20px; width: 30px; height: 40px; background: red }
#a { left: 10px } #b { left: 50px } #c { left: 90px }
#d { left: 130px; background: green } #e { left: 170px; background: green }
#f { left: 210px } #g { left: 250px }
#h { left: 10px; top: 80px; background: green }
#i { left: 50px; top: 80px; background: green }
#j { left: 90px; top: 80px } #k { left: 130px; top: 80px }
@media (300px <= width < 330px) { #a { background: green } }
@media (250px > height >= 240px) { #b { background: green } }
@media screen and ((width < 400px) or (height > 1000px)) and (not (orientation: portrait)) { #c { background: green } }
@media not (future-feature: unknown) { #d { background: red } }
@media (width > 0px) or (height < 0px) and (width > 0px) { #e { background: red } }
@media (future-feature: unknown) or (width = 320px) { #f { background: green } }
@media url(foo) or (color) { #h { background: red } }
@media unknown(url(foo bar)) or (color) { #i { background: red } }
@media url("foo") or (color) { #j { background: green } }
@media unknown(url(foo)) or (color) { #k { background: green } }
</style>
<style media="(width >= 320px) and (height = 240px)">#g { background: green }</style>
<i id=a></i><i id=b></i><i id=c></i><i id=d></i><i id=e></i><i id=f></i><i id=g></i>
<i id=h></i><i id=i></i><i id=j></i><i id=k></i>
