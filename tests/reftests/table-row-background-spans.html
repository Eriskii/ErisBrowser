<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Row backgrounds: originating spans</title><style>
html,body{margin:0;padding:0;background:white;font-size:0;line-height:0}
table,tbody,thead,tfoot,tr,td,th,caption{margin:0;padding:0;border:0;box-sizing:content-box}
table{position:absolute;background:#ffff00;border-spacing:2px 1px}
tbody,thead,tfoot,tr,td,th{background:transparent}
tr{height:2px}td{width:4px;height:2px;vertical-align:top}
</style></head><body>
<table id="rowspan-table" style="left:10px;top:10px;width:14px"><tr id="rowspan-row0" style="height:2px;background-color:red;"><td id="rowspan-a" style="width:4px;height:5px" rowspan="2"></td><td id="rowspan-b" style="width:4px;height:2px"></td></tr><tr id="rowspan-row1" style="height:2px;background-color:blue;"><td id="rowspan-c" style="width:4px;height:2px"></td></tr></table>
<table id="colspan-table" style="left:60px;top:10px;width:20px"><tr id="colspan-row0" style="height:2px;background-color:red;"><td id="colspan-a" style="width:10px;height:2px" colspan="2"></td><td id="colspan-b" style="width:4px;height:2px"></td></tr><tr id="colspan-row1" style="height:2px;background-color:blue;"><td id="colspan-c" style="width:4px;height:2px"></td><td id="colspan-d" style="width:4px;height:2px"></td><td id="colspan-e" style="width:4px;height:2px"></td></tr></table>
</body></html>
