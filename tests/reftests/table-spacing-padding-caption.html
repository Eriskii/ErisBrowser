<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Table spacing: padding and caption</title><style>
html,body{margin:0;padding:0;background:white;font-size:0;line-height:0}
table,tbody,thead,tfoot,tr,td,th,caption{margin:0;padding:0;border:0;box-sizing:content-box}
table{position:absolute;background:#ffff00}
tbody,thead,tfoot,tr{background:transparent}
td{vertical-align:top}
.red{background:#ff0000}.blue{background:#0000ff}.green{background:#00ff00}.black{background:#000000}
</style></head><body>
<table id="padded-table" style="left:10px;top:10px;width:20px;border-spacing:2px 3px;padding:1px 2px 3px 4px;border:1px solid black;"><tr style="height:4px"><td id="padded-red" class="red" style="width:7px;height:4px"></td><td id="padded-blue" class="blue" style="width:7px;height:4px"></td></tr><tr style="height:6px"><td id="padded-green" class="green" style="width:7px;height:6px"></td><td id="padded-black" class="black" style="width:7px;height:6px"></td></tr></table>
<table id="captioned-table" style="left:60px;top:10px;width:20px;border-spacing:2px 3px;"><caption id="captioned-caption" style="display:block;width:20px;height:3px;background:#ff00ff"></caption><tr style="height:4px"><td id="captioned-red" class="red" style="width:7px;height:4px"></td><td id="captioned-blue" class="blue" style="width:7px;height:4px"></td></tr><tr style="height:6px"><td id="captioned-green" class="green" style="width:7px;height:6px"></td><td id="captioned-black" class="black" style="width:7px;height:6px"></td></tr></table>
</body></html>
