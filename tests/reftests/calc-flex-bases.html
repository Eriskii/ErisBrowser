<!doctype html>
<style>
body{margin:0}
main{position:absolute;top:10px;width:60px;display:flex;flex-direction:column;
align-items:flex-start;row-gap:calc(10% + 10px);background:#eeeeee}
#definite{left:10px;height:100px}#indefinite{left:100px;max-height:100px}#zero{left:190px}
i{display:block;flex:0 0 calc(50% - 10px);width:40px;min-height:0;background:#23956b}
i+i{background:#267cbd}b{display:block;height:30px}
#zero i{flex-basis:calc(30px + 0%)}#zero b{height:20px}
</style>
<main id="definite"><i><b></b></i><i><b></b></i></main>
<main id="indefinite"><i><b></b></i><i><b></b></i></main>
<main id="zero"><i><b></b></i><i><b></b></i></main>
