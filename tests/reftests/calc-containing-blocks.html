<!doctype html>
<style>
body{margin:0}
section{position:absolute;left:10px;width:100px;height:50px;background:#eeeeee}
#small{top:10px}#large{top:80px;width:200px}
div{width:calc((25% + 10px) + calc(25% - 20px));height:20px;
margin-left:calc(10% + 5px);padding-left:calc(5% + 2px);padding-right:calc(10px - 2%);background:#da583c}
b{display:block;width:100%;height:20px;background:#23956b}
</style>
<section id="small"><div><b></b></div></section>
<section id="large"><div><b></b></div></section>
