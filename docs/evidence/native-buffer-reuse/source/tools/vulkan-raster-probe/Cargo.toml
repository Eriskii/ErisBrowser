[package]
name = "eris-vulkan-raster-prototype"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[workspace]

[features]
default = []
browser-bridge = ["dep:eris", "eris/raster-bridge"]

[[bin]]
name = "eris-vulkan-reuse-check"
path = "src/bin/reuse-check.rs"

[[bin]]
name = "eris-vulkan-surface-check"
path = "src/bin/surface-check.rs"
required-features = ["browser-bridge"]

[[bin]]
name = "eris-vulkan-browser-check"
path = "src/bin/browser-check.rs"
required-features = ["browser-bridge"]

[[bin]]
name = "eris-vulkan-glyph-check"
path = "src/bin/glyph-check.rs"
required-features = ["browser-bridge"]

[[bin]]
name = "eris-vulkan-worker-text-check"
path = "src/bin/worker-text-check.rs"
required-features = ["browser-bridge"]

[dependencies]
eris-raster-core = { path = "../../crates/raster-core", features = ["gpu"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
eris = { package = "eris-browser", path = "../..", default-features = false, optional = true }

[profile.dev]
debug = 0

[lints.rust]
unsafe_code = "forbid"
